<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048</title>
    <!-- Load Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link to your local CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#faf8ef]">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 bg-[#f9f6f2] flex flex-col justify-center items-center z-50">
        <h1 class="text-8xl font-black text-gray-700">2048</h1>
        <div class="loader mt-5"></div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="fixed inset-0 bg-[#f9f6f2] flex flex-col justify-center items-center z-40" style="display: none;">
        <h1 class="text-8xl font-black text-gray-700 mb-10">2048</h1>
        <button id="start-game-button" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-10 rounded-lg transition-colors text-2xl shadow-lg">
            Start Game
        </button>
    </div>

    <!-- Game UI -->
    <div id="game-ui-container" class="w-full max-w-md mx-auto flex flex-col items-center justify-center min-h-screen p-4" style="display: none;">
        <!-- Header -->
        <header class="flex items-center justify-between mb-4 w-full">
            <h1 class="text-5xl font-black text-gray-700">2048</h1>
            <div class="flex space-x-2">
                <div class="bg-gray-200 rounded-lg p-3 text-center">
                    <div class="text-sm font-bold text-gray-500">SCORE</div>
                    <div id="score" class="text-xl font-bold">0</div>
                </div>
                <div class="bg-gray-200 rounded-lg p-3 text-center">
                    <div class="text-sm font-bold text-gray-500">BEST</div>
                    <div id="best-score" class="text-xl font-bold">0</div>
                </div>
            </div>
        </header>

        <!-- Game Info -->
        <div class="flex items-center justify-between mb-4 w-full">
            <p class="text-gray-600">Join the numbers!</p>
            <button id="new-game-button" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">New Game</button>
        </div>

        <!-- Game Board -->
        <div id="game-container" class="relative bg-gray-300 rounded-lg p-3 aspect-square w-full touch-none">
            <div id="game-board" class="grid grid-cols-4 grid-rows-4 gap-3 w-full h-full">
                <!-- Grid cells generated by JS -->
            </div>
            <div id="tile-container" class="absolute inset-0 z-10 p-3">
                <!-- Tiles generated by JS -->
            </div>
            <div id="game-over-overlay" class="absolute inset-0 bg-white/70 flex flex-col justify-center items-center z-20 rounded-lg" style="display: none;">
                <h2 class="text-5xl font-black text-gray-700 mb-4">Game Over!</h2>
                <button id="try-again-button" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-lg transition-colors text-lg">Try Again</button>
            </div>
        </div>
    </div>

    <!-- Link to your local JS file -->
    <script src="script.js"></script>
</body>
</html>
